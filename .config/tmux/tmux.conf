################################
###### tmux configuration ######
################################

#############
## General ##
#############

# Correct shell
set-option -g default-shell /usr/bin/zsh

# Correct Colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse support
set -g mouse on

# Better window indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g history-limit 50000

set -sg escape-time 10
set -g focus-events on

##############
## Bindings ##
##############

# New tab: Ctrl+t, then n
# (custom key table so Ctrl+t acts as a second, single-purpose prefix)
bind -n C-t switch-client -T tab-table
bind -T tab-table n new-window -c "#{pane_current_path}"
bind -T tab-table Left previous-window
bind -T tab-table Right next-window
bind -T tab-table < swap-window -t -1
bind -T tab-table > swap-window -t +1
bind -T tab-table r display-popup -w 50 -h 3 -x C -y C -T " Rename window " -E "bash -c 'read -e -i \"#W\" -p \"name > \" NAME && tmux rename-window -- \"\$NAME\"'"

# New panes: Alt+n to the right, Shift+Alt+n to the bottom
# (split-window focuses the new pane by default, no extra flag needed)
bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-N split-window -v -c "#{pane_current_path}"

# Detect if the current pane is running vim/nvim, to hand Alt+Arrow off to it
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Pane/window switching: Alt+Arrows
# ensures terminals report modified arrow keys correctly
set -g xterm-keys on
# - inside vim: forwarded to vim (see mappings.lua), which moves splits or asks tmux back
# - inside tmux: moves to the adjacent pane, wrapping to the next/prev window at the edge
bind -n M-Left  if-shell "$is_vim" { send-keys M-Left }  { if-shell -F '#{pane_at_left}'  { previous-window } { select-pane -L } }
bind -n M-Right if-shell "$is_vim" { send-keys M-Right } { if-shell -F '#{pane_at_right}' { next-window }     { select-pane -R } }
bind -n M-Up    if-shell "$is_vim" { send-keys M-Up }    { select-pane -U }
bind -n M-Down  if-shell "$is_vim" { send-keys M-Down }  { select-pane -D }

# Open entire scrollback: Alt+v
bind -n M-v copy-mode \; send-keys -X history-top

# Pane splittings
bind | split-window -h
bind \\ split-window -v
unbind '"'
unbind %

# Config reloads
bind r source-file ~/.config/tmux/tmux.conf

bind s set-window-option synchronize-panes

#############
## Plugins ##
#############

# tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible -> https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-sensible'

# nvim / tmux Nav
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux yank
set -g @plugin 'tmux-plugins/tmux-yank'

# Search scrollback buffer
set -g @plugin 'roosta/tmux-fuzzback'

# Floating pane
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

###########
## Theme ##
###########

# General theme and flavour
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'macchiato'

# Custom modules
set -g @plugin 'tmux-plugins/tmux-cpu'

# Separators
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_middle_separator "█ "

# Color fills
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

# Window descriptions
set -g @catppuccin_window_current_text "#W @ #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"
set -g @catppuccin_window_default_text "#W @ #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"

# Status icons
set -g @catppuccin_window_status_enable "no"
set -g @catppuccin_window_status_icon_enable "no"
set -g @catppuccin_icon_window_last "󰖰"
set -g @catppuccin_icon_window_current "󰖯"
set -g @catppuccin_icon_window_zoom "󰁌"
set -g @catppuccin_icon_window_mark "󰃀"
set -g @catppuccin_icon_window_silent "󰂛"
set -g @catppuccin_icon_window_activity "󰖲"
set -g @catppuccin_icon_window_bell "󰂞"

# Right corner
set -g @catppuccin_status_modules_right "cpu"
set -g @catppuccin_status_left_separator  " █"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

# Format stuff
set -g @catppuccin_date_time_text "%H:%M %d.%m.%y"

###############
## Finishing ##
###############

run '~/.config/tmux/plugins/tpm/tpm'

set -g pane-border-lines single
set -g pane-active-border-style fg=colour242
set -g pane-border-style fg=colour238
